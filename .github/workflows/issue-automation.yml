name: Issue Automation

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Issue title'
        required: true
      summary:
        description: 'Summary or problem statement'
        required: true
      user_story:
        description: 'User story or task description'
        required: false
      acceptance_criteria:
        description: 'Acceptance criteria (one per line)'
        required: false
      open_questions:
        description: 'Open questions'
        required: false
      risks_notes:
        description: 'Risks or notes'
        required: false
      labels:
        description: 'Comma-separated labels'
        required: false
        default: 'needs-triage'
      create_branch:
        description: 'Create a branch for this issue?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  issues: write
  contents: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub issue
        id: create-issue
        env:
          TITLE: ${{ github.event.inputs.title }}
          SUMMARY: ${{ github.event.inputs.summary }}
          USER_STORY: ${{ github.event.inputs.user_story }}
          ACCEPTANCE_CRITERIA: ${{ github.event.inputs.acceptance_criteria }}
          OPEN_QUESTIONS: ${{ github.event.inputs.open_questions }}
          RISKS_NOTES: ${{ github.event.inputs.risks_notes }}
          LABELS: ${{ github.event.inputs.labels }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.TITLE;
            const summary = process.env.SUMMARY;
            const userStory = process.env.USER_STORY;
            const acceptanceCriteria = process.env.ACCEPTANCE_CRITERIA;
            const openQuestions = process.env.OPEN_QUESTIONS;
            const risksNotes = process.env.RISKS_NOTES;
            const labels = process.env.LABELS
              .split(',')
              .map(label => label.trim())
              .filter(Boolean);

            const sections = [
              summary,
              '',
              '## User Story',
              userStory ? userStory : '- TBD',
              '',
              '## Acceptance Criteria',
              acceptanceCriteria ? acceptanceCriteria : '- TBD',
              '',
              '## Open Questions',
              openQuestions ? openQuestions : '- None at this time.',
              '',
              '## Risks / Notes',
              risksNotes ? risksNotes : '- None at this time.'
            ];

            const body = sections.join('\n');

            const response = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels
            });

            core.setOutput('issue_number', response.data.number);
            core.setOutput('issue_url', response.data.html_url);

      - name: Checkout repository
        if: ${{ github.event.inputs.create_branch == 'true' }}
        uses: actions/checkout@v4

      - name: Create branch for issue
        if: ${{ github.event.inputs.create_branch == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TITLE_SLUG=$(echo "${{ github.event.inputs.title }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          BRANCH_NAME="issue-${{ steps.create-issue.outputs.issue_number }}-${TITLE_SLUG}"
          git checkout -B "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Comment on issue with branch name
        if: ${{ github.event.inputs.create_branch == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.create-issue.outputs.issue_number }}'),
              body: `Branch created: \`${process.env.BRANCH_NAME}\``
            });
